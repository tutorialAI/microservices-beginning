# .air.toml
[build]
  bin = "app"                     # Binary name
  cmd = "go build -o ./bin/app main.go" # Command to build the project
  full_bin = "./bin/app"
  log = "build-errors.log"

[run]
  cmd = "./bin/app"               # Command to run the application
  watch_dirs = ["."]
  exclude_dirs = ["vendor", "bin", "node_modules"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  delay = 1000                    # Delay in milliseconds before restarting
  kill_signal = "SIGTERM"
  log = "run-errors.log"

[log]
  level = "debug"
